<svg xmlns="http://www.w3.org/2000/svg" viewBox="810 105 565 550"><defs>
    <linearGradient id="limeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7FF9A"/>
      <stop offset="1" stop-color="#A8E926"/>
    </linearGradient>
    <linearGradient id="violetGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A83FF"/>
      <stop offset="1" stop-color="#5E3BE8"/>
    </linearGradient>
    <linearGradient id="wineGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A183B"/>
      <stop offset="1" stop-color="#3F071B"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F4F1E8" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <pattern id="gridDark" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0A0A0A" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <filter id="shadowSmall" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".22"/>
    </filter>
    <clipPath id="desktopClip"><rect width="1440" height="5200" rx="2"/></clipPath>
    <clipPath id="mobileClip"><rect width="390" height="5200" rx="28"/></clipPath>
    <style>
      .display{font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;letter-spacing:-.045em}
      .heading{font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;letter-spacing:-.025em}
      .medium{font-family:'Space Grotesk',Arial,sans-serif;font-weight:500}
      .body{font-family:'DM Sans',Arial,sans-serif;font-weight:400}
      .mono{font-family:'IBM Plex Mono',monospace;font-weight:500;letter-spacing:.08em}
      .paper{fill:#F4F1E8}.ink{fill:#0A0A0A}.muted{fill:#B7B3A9}.lime{fill:#C8FF45}.violet{fill:#7C5CFF}
    .badge{animation:float 6s ease-in-out infinite}.uiux{animation-delay:-3s}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){.badge{animation:none}}</style>
  </defs>
      <circle cx="1092" cy="386" r="262" fill="url(#grid)" stroke="#313131"/>
      <circle cx="1092" cy="386" r="202" fill="url(#limeGlow)"/>
      <circle cx="1092" cy="386" r="142" fill="#0A0A0A"/>
      <circle cx="1092" cy="386" r="80" fill="url(#violetGlow)"/>
      <path d="M1092 118V654M824 386H1360" stroke="#F4F1E8" stroke-opacity=".5"/>
      <g transform="rotate(-12 961 216)"><g class="badge branding"><rect x="878" y="190" width="166" height="52" rx="26" fill="#F4F1E8" filter="url(#shadowSmall)"/><text x="961" y="216" text-anchor="middle" dominant-baseline="central" class="mono ink" font-size="12">BRANDING</text></g></g>
      <g transform="rotate(9 1204 584)"><g class="badge uiux"><rect x="1112" y="558" width="184" height="52" rx="26" fill="#7C5CFF" filter="url(#shadowSmall)"/><text x="1204" y="584" text-anchor="middle" dominant-baseline="central" class="mono paper" font-size="12">UI / UX DESIGN</text></g></g>
      </svg>